name: CI

on:
  push:
    branches: [develop, master, main]
  pull_request:
    branches: [develop, master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Fast static checks (JSON/YAML validity, PEP 668 regression, shellcheck)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq

      - name: Shellcheck INSTALL.sh
        run: |
          # INSTALL.sh sources ../lib/common.sh (from parent dotfiles repo).
          # Provide a minimal stub so shellcheck can parse the rest.
          mkdir -p ../lib
          cat > ../lib/common.sh << 'STUB'
          #!/bin/bash
          apt_install() { echo "apt_install $*"; }
          require_dep() { command -v "$1" >/dev/null 2>&1 || return 1; }
          install_skip() { echo "SKIP: $*"; }
          install_error() { echo "ERROR: $*" >&2; }
          detect_de() { echo other; }
          detect_session() { echo unknown; }
          STUB
          shellcheck -x -e SC1091,SC2034,SC2086,SC2155 INSTALL.sh || {
            echo "::warning::shellcheck reported issues (see log)"
            # Keep the job green for style warnings; fail only on serious errors
            shellcheck -S error -x -e SC1091 INSTALL.sh
          }

      - name: Validate installer metadata (PEP 668 / pipx)
        run: |
          chmod +x scripts/ci-check-install-metadata.sh
          ./scripts/ci-check-install-metadata.sh

      - name: Installer and linter-wrapper regression tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Installer shell syntax
        run: |
          for script in INSTALL.sh UNINSTALL.sh efm-langserver-linter-wrapper.sh scripts/*.sh; do
            bash -n "$script"
          done

      - name: Validate lsp-servers.json schema basics
        run: |
          jq -e '.servers | type == "array"' lsp-servers.json
          jq -e 'all(.servers[]; has("name") and has("cmd") and has("filetypes"))' lsp-servers.json
          echo "lsp-servers.json structure OK"

  # No user startup or live plugin/package installs: real editor/LSP APIs with
  # isolated external-plugin APIs and a deterministic local stdio LSP peer.
  editor:
    name: ${{ matrix.editor }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        editor: [vim, nvim]
    env:
      # Minimum supported release: native EFM uses the Neovim 0.11 LSP API.
      NVIM_VERSION: "0.11.6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vim (Linux)
        if: runner.os == 'Linux' && matrix.editor == 'vim'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq vim-nox

      - name: Locate Git Bash Vim (Windows)
        if: runner.os == 'Windows' && matrix.editor == 'vim'
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
          $vim = Join-Path $gitRoot 'usr\bin\vim.exe'
          if (!(Test-Path $vim)) { throw "Git Bash Vim is missing: $vim" }
          "EDITOR_EXECUTABLE=$vim" >> $env:GITHUB_ENV
          (Join-Path $gitRoot 'usr\bin') >> $env:GITHUB_PATH

      - name: Install pinned Neovim (Linux)
        if: runner.os == 'Linux' && matrix.editor == 'nvim'
        run: |
          mkdir -p .ci-nvim
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/v${NVIM_VERSION}/nvim-linux-x86_64.tar.gz" \
            --output .ci-nvim/nvim.tar.gz
          tar -xzf .ci-nvim/nvim.tar.gz -C .ci-nvim
          echo "$GITHUB_WORKSPACE/.ci-nvim/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install pinned Neovim (Windows)
        if: runner.os == 'Windows' && matrix.editor == 'nvim'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .ci-nvim -Force | Out-Null
          Invoke-WebRequest `
            "https://github.com/neovim/neovim/releases/download/v$env:NVIM_VERSION/nvim-win64.zip" `
            -OutFile .ci-nvim\nvim.zip
          Expand-Archive .ci-nvim\nvim.zip -DestinationPath .ci-nvim
          "$env:GITHUB_WORKSPACE\.ci-nvim\nvim-win64\bin" >> $env:GITHUB_PATH
          $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
          (Join-Path $gitRoot 'usr\bin') >> $env:GITHUB_PATH

      - name: Run isolated editor regressions (Linux)
        if: runner.os == 'Linux'
        run: |
          ${{ matrix.editor }} --version | head -3
          python -B scripts/run-editor-tests.py --editor ${{ matrix.editor }}

      - name: Run isolated editor regressions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $editor = '${{ matrix.editor }}'
          $executable = $env:EDITOR_EXECUTABLE
          if (!$executable) { $executable = (Get-Command $editor).Source }
          & $executable --version | Select-Object -First 3
          python -B scripts\run-editor-tests.py --editor $editor --executable $executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ---------------------------------------------------------------------------
  # Smoke-test key install paths on a PEP-668-style environment
  # ---------------------------------------------------------------------------
  install-smoke:
    name: Install smoke (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps used by installer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            jq curl python3 python3-pip python3-venv python3-yaml \
            pipx nodejs npm vim-nox
          # Ensure user local bin is on PATH (pipx default)
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          pipx ensurepath || true

      - name: Stub parent common.sh (standalone .vim checkout)
        run: |
          mkdir -p ../lib
          cat > ../lib/common.sh << 'STUB'
          #!/bin/bash
          apt_install() {
            echo "INFO: sudo apt-get install -y $*"
            sudo apt-get install -y "$@"
          }
          require_dep() {
            if ! command -v "$1" >/dev/null 2>&1 && [ -n "${2:-}" ]; then
              apt_install "$2"
            fi
            command -v "$1" >/dev/null 2>&1 && return 0
            echo "ERROR: dependency \"$1\" is missing" >&2
            return 1
          }
          install_skip() { echo "SKIP: $*"; }
          install_error() { echo "ERROR: $*" >&2; }
          detect_de() { echo other; }
          detect_session() { echo unknown; }
          STUB

      - name: Run Python LSP install path (pipx)
        env:
          # Avoid interactive vim PlugInstall in CI
          TERM: dumb
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          # Read the exact shared commands instead of duplicating package metadata.
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          import shlex
          import subprocess
          spec = importlib.util.spec_from_file_location("installer", "scripts/install-lsp-tools.py")
          installer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(installer)
          targets = {"basedpyright-langserver", "ruff"}
          commands = {
              binary: command
              for _, binary, command in installer.tool_metadata(Path.cwd())
              if binary in targets
          }
          assert commands.keys() == targets, "Python smoke targets missing from shared metadata"
          for binary, command in sorted(commands.items()):
              argv = shlex.split(command)
              assert argv[:2] == ["pipx", "install"], command
              print(f">>> {binary}: {command}", flush=True)
              subprocess.run(argv, check=True)
          PY

          # basedpyright exposes basedpyright-langserver; ruff exposes ruff
          command -v ruff
          command -v basedpyright-langserver || command -v basedpyright

          echo "pipx Python LSP tools installed successfully"

      - name: install-lsp-tools.py dry-run
        run: python3 scripts/install-lsp-tools.py --dry-run

      - name: Validate shared install-command metadata
        run: |
          # Confirm declared install commands have available package managers.
          jq -r '.servers[] | select(.install) | "\(.name)\t\(.install)"' lsp-servers.json | while IFS=$'\t' read -r name cmd; do
            echo "would install: $name -> $cmd"
            manager=$(echo "$cmd" | awk '{print $1}')
            command -v "$manager" >/dev/null || { echo "missing manager: $manager"; exit 1; }
          done
          echo "INSTALL.sh install-command parsing OK"
